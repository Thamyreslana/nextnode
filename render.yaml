# NextNode — Render.com Configuration
services:
  - type: web
    name: nextnode-hardware-store
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --bind 0.0.0.0:$PORT
    envVars:
      # Só a versão "menor": o Render usa o patch 3.14.x mais recente que tiver.
      # Precisa bater com o requires-python do pyproject.toml (>=3.14)
      - key: PYTHON_VERSION
        value: "3.14"
